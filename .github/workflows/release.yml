name: Release

# Release trigger: a push to main (i.e. development merged into main), per
# docs/startup.md's branching model. Builds the Windows installer and
# publishes it as a GitHub Release tagged from package.json's version.
# Skips entirely if that version's release already exists, so re-merging or
# re-running this workflow is a safe no-op instead of clobbering a release.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version from package.json
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned (not "latest") so the cache key stays meaningful and a repeat
      # build can't silently pick up a different makensis.exe than last time.
      - name: Cache NSIS
        if: steps.check.outputs.exists == 'false'
        id: nsis-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: handymon-nsis-3.12.0

      - name: Install NSIS
        if: steps.check.outputs.exists == 'false' && steps.nsis-cache.outputs.cache-hit != 'true'
        run: choco install nsis --version=3.12.0 -y

      - name: npm ci
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      # Persists PresentMon/LibreHardwareMonitor/PawnIO downloads across runs
      # (each run is a fresh VM, so package-win.js's own on-disk cache is
      # otherwise useless in CI) -- also means a run isn't blocked by upstream
      # GitHub Releases downtime, or a pinned release being pulled, once
      # cached. Keyed on package-win.js's own content, since that's where the
      # pinned download URLs/versions live -- bumping a pin invalidates the
      # cache automatically.
      - name: Cache bundled tool downloads (PresentMon/LHM/PawnIO)
        if: steps.check.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: C:\HandyMon-package-cache
          key: handymon-package-cache-${{ hashFiles('scripts/package-win.js') }}

      - name: Build installer
        if: steps.check.outputs.exists == 'false'
        run: npm run package:win

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "dist/HandyMon-Setup-${{ steps.ver.outputs.version }}.exe" \
            --repo "${{ github.repository }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes

      - name: Skip notice
        if: steps.check.outputs.exists == 'true'
        run: echo "v${{ steps.ver.outputs.version }} already has a release — skipping build. Bump package.json's version before merging to main to cut a new one."
